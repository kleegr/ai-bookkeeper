<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookkeeperAI – Your 24/7 AI Bookkeeper</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
  }
  
  .container {
    max-width: 600px;
    padding: 2rem;
  }
  
  h1 {
    font-size: 3rem;
    margin-bottom: 1rem;
    font-weight: 300;
  }
  
  p {
    font-size: 1.2rem;
    margin-bottom: 2rem;
    opacity: 0.9;
  }
  
  .setup-btn {
    display: inline-block;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    text-decoration: none;
    padding: 1rem 2rem;
    border-radius: 50px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    font-size: 1.1rem;
    font-weight: 500;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
  }
  
  .setup-btn:hover {
    background: rgba(255, 255, 255, 0.3);
    border-color: rgba(255, 255, 255, 0.5);
    transform: translateY(-2px);
  }
  
  .features {
    margin-top: 3rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1.5rem;
    opacity: 0.8;
  }
  
  .feature {
    font-size: 0.9rem;
  }
  
  .feature-icon {
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Coming Soon</h1>
    <p>AI Bookkeeper SaaS - Your QuickBooks-powered AI assistant for small businesses</p>
    <a href="/setup" class="setup-btn">Start Setup</a>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon">📊</div>
        <div>Real-time Reports</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🤖</div>
        <div>AI-Powered Insights</div>
      </div>
      <div class="feature">
        <div class="feature-icon">⚡</div>
        <div>24/7 Availability</div>
      </div>
    </div>
  </div>
</body>
</html>
